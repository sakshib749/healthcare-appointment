
apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-appointment
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-appointment
  template:
    metadata:
      labels:
        app: healthcare-appointment
    spec:
      containers:
        - name: healthcare-appointment
          image: healthcare-appointment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-appointment
  namespace: healthcare
  labels:
    app: healthcare-appointment
spec:
  type: NodePort
  selector:
    app: healthcare-appointment
  ports:
    - port: 8080
      targetPort: 9090
      nodePort: 30080

